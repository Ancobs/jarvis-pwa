<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JARVIS" />
  <meta name="theme-color" content="#00f0ff" />
  <meta name="description" content="J.A.R.V.I.S. - Just A Rather Very Intelligent System. Asistente AI estilo Stark Industries para iPad y Android." />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <title>J.A.R.V.I.S.</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="boot-screen">
    <div class="boot-logo">
      <div class="arc-reactor boot"></div>
      <h1>J.A.R.V.I.S.</h1>
      <p class="boot-status">Inicializando sistemas...</p>
      <div class="boot-bar"><div class="boot-progress"></div></div>
    </div>
  </div>

  <div id="app" class="hidden">
    <!-- Top status bar -->
    <header class="status-bar">
      <div class="status-left">
        <span id="time-display">00:00</span>
        <span id="date-display"></span>
      </div>
      <div class="status-center">
        <span class="status-dot online"></span>
        <span>SISTEMAS EN LÍNEA</span>
      </div>
      <div class="status-right">
        <span id="battery-display">—</span>
        <span id="weather-mini">—</span>
      </div>
    </header>

    <!-- Main HUD -->
    <main class="hud">
      <!-- Left panel -->
      <aside class="panel left-panel">
        <div class="panel-header">SISTEMA</div>
        <div class="panel-content">
          <div class="metric"><span>CPU</span><div class="bar"><div id="cpu-bar" style="width:42%"></div></div></div>
          <div class="metric"><span>MEM</span><div class="bar"><div id="mem-bar" style="width:67%"></div></div></div>
          <div class="metric"><span>NET</span><div class="bar"><div id="net-bar" style="width:88%"></div></div></div>
          <div class="sys-info">
            <p>Uptime: <span id="uptime">00:00:00</span></p>
            <p>Notas: <span id="notes-count">0</span></p>
            <p>Timers: <span id="timers-count">0</span></p>
          </div>
        </div>
        <div class="panel-header">CLIMA</div>
        <div class="panel-content" id="weather-panel">
          <p class="weather-temp" id="weather-temp">—</p>
          <p id="weather-desc">Obteniendo ubicación...</p>
          <p id="weather-details"></p>
        </div>
      </aside>

      <!-- Center: Arc Reactor + Voice -->
      <section class="center-stage">
        <div class="arc-container">
          <div class="arc-reactor" id="arc-reactor">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
            <div class="core"></div>
          </div>
          <canvas id="voice-canvas" width="280" height="80"></canvas>
        </div>
        <div class="voice-status" id="voice-status">Listo, señor.</div>
        <div class="controls">
          <button id="mic-btn" class="control-btn" title="Activar micrófono">
            <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
          </button>
          <button id="speak-btn" class="control-btn secondary" title="Hablar">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </button>
        </div>
      </section>

      <!-- Right panel -->
      <aside class="panel right-panel">
        <div class="panel-header">MEMORIA / NOTAS</div>
        <div class="panel-content notes-area">
          <ul id="notes-list"></ul>
          <div class="note-input-row">
            <input type="text" id="note-input" placeholder="Nueva nota..." />
            <button id="add-note-btn">+</button>
          </div>
        </div>
        <div class="panel-header">TIMERS ACTIVOS</div>
        <div class="panel-content" id="timers-panel">
          <p class="empty">Ningún timer activo</p>
        </div>
      </aside>
    </main>

    <!-- Chat / Log -->
    <section class="chat-section">
      <div class="chat-log" id="chat-log"></div>
      <div class="input-row">
        <input type="text" id="text-input" placeholder="Escribe un comando o pregunta..." autocomplete="off" />
        <button id="send-btn">ENVIAR</button>
      </div>
    </section>

    <!-- Install banner -->
    <div id="install-banner" class="hidden">
      <span>Instalar J.A.R.V.I.S. en tu iPad / dispositivo</span>
      <button id="install-btn">INSTALAR</button>
      <button id="dismiss-install">×</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
